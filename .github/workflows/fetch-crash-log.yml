name: Fetch Android crash log

on:
  push:
    branches:
      - build/audio8-android-20260815

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch crDroid paste
        shell: bash
        run: |
          set -euo pipefail
          echo '=== crDroid paste API ==='
          curl -fsSL 'https://paste.crdroid.net/api/v2/pastes/3uFueu'
          echo
