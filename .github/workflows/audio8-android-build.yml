name: Audio8 Android UX

on:
  push:
    branches: [feat/audio8-mobile-ux-20260815]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore Audio8 mobile UX source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/audio8/work
          cat .ci/audio8/ux/source.b64.part* | base64 -d > .ci/audio8/ux_source.tar.xz
          echo '95b57808be34af9b71ff314db6befcfe41de47a77d07e1a3b82b2e26d06ae4c8  .ci/audio8/ux_source.tar.xz' | sha256sum -c -
          tar -xJf .ci/audio8/ux_source.tar.xz -C .ci/audio8/work
          PROJECT=.ci/audio8/work/audio8_offline_tts_android
          patch -d "$PROJECT" -p1 < "$GITHUB_WORKSPACE/.ci/audio8/ux/page_shell_fix.patch"
          chmod +x "$PROJECT"/tools/*.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Verify toolchain
        run: |
          flutter --version
          flutter doctor -v

      - name: Verify Kotlin core
        working-directory: .ci/audio8/work/audio8_offline_tts_android
        run: ./tools/verify_core.sh

      - name: Verify project structure
        working-directory: .ci/audio8/work/audio8_offline_tts_android
        run: python3 tools/verify_project.py

      - name: Analyze, test, and build release APK
        working-directory: .ci/audio8/work/audio8_offline_tts_android
        run: ./tools/build_android.sh

      - name: Package deliverables
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=.ci/audio8/work/audio8_offline_tts_android
          APK="$PROJECT/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          python3 "$PROJECT/tools/verify_apk.py" "$APK"
          mkdir -p dist
          cp "$APK" dist/Audio8_Offline_TTS_Android_v0.2.0+3.apk
          sha256sum dist/Audio8_Offline_TTS_Android_v0.2.0+3.apk > dist/Audio8_Offline_TTS_Android_v0.2.0+3.apk.sha256
          (cd .ci/audio8/work && zip -qr "$GITHUB_WORKSPACE/dist/Audio8_Offline_TTS_Android_Source_v0.2.0+3.zip" audio8_offline_tts_android -x '*/build/*' '*/.dart_tool/*' '*/.gradle/*')
          sha256sum dist/Audio8_Offline_TTS_Android_v0.2.0+3.apk dist/Audio8_Offline_TTS_Android_Source_v0.2.0+3.zip > dist/SHA256SUMS.txt
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: audio8-offline-android-v0.2.0+3
          path: dist/
          if-no-files-found: error
          retention-days: 14
